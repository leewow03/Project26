<!DOCTYPE html>
<html lang="ko">
<head>
    <title>삐용 — 차량 분석</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/mainstyle.css">
    <style>
    body { min-height:100vh; }

    .analyze-wrap {
        max-width: 1300px;
        margin: 0 auto;
        padding: calc(var(--nav-h) + 3rem) 2rem 4rem;
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 1.75rem;
        align-items: start;
    }

    /* ── 업로드 패널 ── */
    .upload-panel {
        background: var(--bg-glass);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 2rem;
        position: sticky;
        top: calc(var(--nav-h) + 1rem);
    }

    .panel-title {
        font-family: var(--font-display);
        font-size: 1.5rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
    }

    .panel-title::before {
        content: '';
        display: block;
        width: 4px; height: 1.4rem;
        background: var(--red);
        border-radius: 2px;
    }

    /* 탭 (이미지 / 영상) */
    .type-tabs { display:flex; gap:0.5rem; margin-bottom:1.25rem; }

    /* 파일 선택 버튼 */
    .file-label {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        width: 100%;
        padding: 0.7rem 1rem;
        background: var(--red-dim);
        border: 1px solid rgba(255,51,51,0.35);
        border-radius: var(--radius-sm);
        color: var(--red);
        font-family: var(--font-mono);
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
        transition: background .2s;
        margin-bottom: 1rem;
    }
    .file-label:hover { background: rgba(255,51,51,0.2); }

    /* 미리보기 박스 */
    .preview-box {
        width: 100%; height: 220px;
        background: rgba(0,0,0,0.3);
        border: 1px dashed var(--border);
        border-radius: var(--radius-sm);
        display: flex; align-items: center; justify-content: center;
        overflow: hidden; margin-bottom: 1.25rem;
        transition: border-color .2s;
        position: relative;
    }
    .preview-box:hover { border-color: rgba(255,51,51,0.3); }
    .preview-box img, .preview-box video { max-width:100%; max-height:100%; object-fit:contain; }
    .preview-placeholder { color:var(--text-muted); font-family:var(--font-mono); font-size:0.75rem; letter-spacing:1px; }

    /* 메모 입력 */
    .memo-group { margin-bottom: 1.25rem; }
    .memo-group label {
        display: block;
        font-family: var(--font-mono); font-size:0.68rem;
        font-weight:700; letter-spacing:2px; text-transform:uppercase;
        color:var(--text-muted); margin-bottom:0.4rem;
    }
    .memo-group input {
        width:100%; padding:0.7rem 0.9rem;
        background:rgba(255,255,255,0.04);
        border:1px solid var(--border);
        border-radius:var(--radius-sm);
        color:var(--text-primary);
        font-family:var(--font-body); font-size:0.88rem;
        outline:none; transition: border-color .2s;
    }
    .memo-group input:focus { border-color:var(--red); }
    .memo-group input::placeholder { color:rgba(240,244,255,0.2); }

    /* 분석 시작 버튼 */
    .analyze-btn {
        width: 100%; padding: 0.9rem;
        background: var(--red); color: #fff; border: none;
        border-radius: var(--radius-sm);
        font-family: var(--font-mono); font-size: 0.82rem;
        font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
        cursor: pointer;
        transition: background .2s, transform .15s, box-shadow .2s;
    }
    .analyze-btn:hover {
        background: #ff5555; transform: translateY(-1px);
        box-shadow: 0 8px 24px var(--red-glow);
    }
    .analyze-btn:disabled { background: var(--border); color: var(--text-muted); cursor:not-allowed; transform:none; box-shadow:none; }

    /* ── 결과 패널 ── */
    .result-panel {
        background: var(--bg-glass);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        min-height: 500px;
    }

    .result-panel-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 1.2rem 1.75rem;
        border-bottom: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
    }

    .result-panel-header h3 {
        font-family: var(--font-mono); font-size:0.78rem;
        letter-spacing:2px; text-transform:uppercase;
        display: flex; align-items: center; gap: 8px;
    }

    .result-panel-header h3::before {
        content:''; width:6px; height:6px; border-radius:50%;
        background: var(--red); animation: pulse 1.2s infinite;
    }

    /* 결과 없을 때 */
    .result-empty {
        display: flex; flex-direction:column;
        align-items: center; justify-content: center;
        height: 440px; gap: 1rem;
        color: var(--text-muted);
        font-family: var(--font-mono); font-size: 0.8rem; letter-spacing:1px;
    }
    .result-empty span { font-size: 2.5rem; }

    /* 결과 콘텐츠 */
    .result-content { padding: 1.75rem; }

    .result-status {
        display: flex; align-items: center; gap: 0.75rem;
        margin-bottom: 1.5rem;
    }
    .result-status .label {
        font-family: var(--font-mono); font-size:0.72rem;
        letter-spacing:2px; text-transform:uppercase; color:var(--text-muted);
    }

    /* 감지 배지 */
    .detect-badge {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 0.35rem 1rem; border-radius: 4px;
        font-family: var(--font-mono); font-size: 0.8rem; font-weight:700;
        letter-spacing:1px; text-transform:uppercase;
    }
    .detect-badge.emergency { background:rgba(255,51,51,0.15); border:1px solid rgba(255,51,51,0.4); color:var(--red); }
    .detect-badge.safe      { background:rgba(0,209,178,0.12); border:1px solid rgba(0,209,178,0.3); color:var(--teal); }

    /* 분석 텍스트 영역 */
    .result-text-area {
        background: rgba(0,0,0,0.35);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 1.5rem;
        min-height: 200px;
        color: var(--text-primary);
        font-size: 1rem; line-height:1.75;
        overflow-y: auto;
        white-space: pre-wrap;
        margin-bottom: 1.25rem;
    }

    .result-notice {
        text-align:center; color:var(--text-muted);
        font-size:0.78rem; margin-bottom:1.25rem;
    }

    .detail-btn {
        display: flex; justify-content: center;
    }

    /* 컨텍스트 메뉴 */
    #ctx-menu {
        display:none; position:fixed; z-index:9999;
        background:var(--bg-panel);
        border:1px solid var(--border-r);
        border-radius:var(--radius-sm);
        overflow:hidden;
        box-shadow:0 4px 20px rgba(0,0,0,0.5);
    }
    #ctx-menu div {
        padding:0.75rem 1.25rem;
        color:var(--text-primary);
        font-size:0.85rem; cursor:pointer;
        transition:background .15s;
    }
    #ctx-menu div:hover { background:var(--red); color:#fff; }

    /* 로딩 오버레이 */
    .loading-overlay {
        display:none; position:absolute; inset:0;
        background:rgba(6,8,16,0.7);
        align-items:center; justify-content:center;
        flex-direction:column; gap:1rem;
        font-family:var(--font-mono); font-size:0.78rem; letter-spacing:2px;
        color:var(--red); z-index:10;
    }
    .loading-overlay.active { display:flex; }
    .spinner {
        width:32px; height:32px;
        border:2px solid rgba(255,51,51,0.2);
        border-top-color:var(--red);
        border-radius:50%;
        animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    @media (max-width:900px) {
        .analyze-wrap { grid-template-columns:1fr; }
        .upload-panel { position:static; }
    }
    </style>
</head>
<body>

<!-- 컨텍스트 메뉴 -->
<div id="ctx-menu">
    <div onclick="clearPreview()">🗑️ 파일 삭제하기</div>
</div>

<!-- ── 네비게이션 ── -->
<nav class="top-nav">
    <a href="/" class="nav-title">
        <span class="siren-icon"><span>◉</span><span>◉</span></span>삐용
    </a>
    <div class="nav-right">
        <a href="/introduce" class="nav-item">소개</a>
        <a href="/analyze"   class="nav-item active">분석</a>
        <a href="/board"     class="nav-item">게시판</a>
        {% if session.get('user_name') %}
        <a href="/mypage" class="nav-item">마이페이지</a>
        <a href="/logout" class="nav-item">로그아웃</a>
        {% else %}
        <a href="/login" class="nav-item">로그인</a>
        <a href="/join"  class="hero-btn primary" style="min-width:auto;height:36px;padding:0 18px;font-size:0.7rem;">회원가입</a>
        {% endif %}
    </div>
</nav>

<div class="analyze-wrap">

    <!-- ── 왼쪽: 업로드 패널 ── -->
    <div class="upload-panel">
        <div class="panel-title">데이터 업로드</div>

        <!-- 이미지/영상 탭 -->
        <div class="type-tabs">
            <button class="type-tab active" id="tab-img" onclick="switchTab('img')">이미지</button>
            <button class="type-tab"        id="tab-vid" onclick="switchTab('vid')">영상</button>
        </div>

        <form id="uploadForm">
            <!-- 파일 선택 -->
            <label class="file-label" for="fileInput">
                📂 파일 선택
            </label>
            <input type="file" id="fileInput" name="image_file"
                   accept="image/*" style="display:none"
                   onchange="previewFile()">

            <!-- 미리보기 -->
            <div class="preview-box" id="previewBox">
                <span class="preview-placeholder">미리보기</span>
            </div>

            <!-- 메모 -->
            <div class="memo-group">
                <label>메모</label>
                <input type="text" name="description" id="description" placeholder="설명을 입력하세요 (선택)">
            </div>

            <!-- 분석 시작 -->
            <button type="button" class="analyze-btn" id="analyzeBtn"
                    onclick="startAnalysis()" disabled>
                🚨 분석 시작
            </button>
        </form>
    </div>

    <!-- ── 오른쪽: 결과 패널 ── -->
    <div class="result-panel" style="position:relative;">

        <!-- 로딩 오버레이 -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <span>AI 분석 중...</span>
        </div>

        <div class="result-panel-header">
            <h3>분석 결과</h3>
            <span id="resultTime" style="font-family:var(--font-mono);font-size:0.72rem;color:var(--text-muted);"></span>
        </div>

        <!-- 결과 없을 때 -->
        <div class="result-empty" id="resultEmpty">
            <span>📡</span>
            파일을 업로드하면 분석이 시작됩니다
        </div>

        <!-- 결과 있을 때 -->
        <div class="result-content" id="resultContent" style="display:none;">
            <div class="result-status">
                <span class="label">식별 결과</span>
                <span class="detect-badge" id="detectBadge"></span>
            </div>

            <div class="result-text-area" id="resultText"></div>

            <p class="result-notice">※ AI 분석 결과이며 실제와 다를 수 있습니다.</p>

            <div class="detail-btn">
                <button class="hero-btn primary" onclick="goDetail()" style="min-width:200px;">
                    자세히 보기
                </button>
            </div>
        </div>
    </div>

</div>

<script>
    let currentTab = 'img';

    // ── 탭 전환 ──
    function switchTab(type) {
        currentTab = type;
        document.getElementById('tab-img').classList.toggle('active', type === 'img');
        document.getElementById('tab-vid').classList.toggle('active', type === 'vid');

        const input = document.getElementById('fileInput');
        input.accept = type === 'img' ? 'image/*' : 'video/*';
        input.value  = '';
        input.name   = type === 'img' ? 'image_file' : 'video_file';

        clearPreview();
    }

    // ── 파일 미리보기 ──
    function previewFile() {
        const input   = document.getElementById('fileInput');
        const box     = document.getElementById('previewBox');
        const file    = input.files[0];
        const btn     = document.getElementById('analyzeBtn');

        if (!file) return;
        btn.disabled = false;
        box.innerHTML = '';

        const reader = new FileReader();
        reader.onload = e => {
            if (currentTab === 'img') {
                const img = document.createElement('img');
                img.src = e.target.result;
                box.appendChild(img);
            } else {
                const vid = document.createElement('video');
                vid.src = e.target.result;
                vid.controls = true;
                vid.style.width = '100%';
                box.appendChild(vid);
            }
        };
        reader.readAsDataURL(file);
    }

    // ── 미리보기 초기화 ──
    function clearPreview() {
        document.getElementById('fileInput').value = '';
        document.getElementById('previewBox').innerHTML = '<span class="preview-placeholder">미리보기</span>';
        document.getElementById('analyzeBtn').disabled = true;
        document.getElementById('ctx-menu').style.display = 'none';
    }

    // ── 분석 시작 ──
    function startAnalysis() {
        const form    = document.getElementById('uploadForm');
        const fileEl  = document.getElementById('fileInput');

        if (!fileEl.files[0]) { alert('파일을 선택해주세요.'); return; }

        const formData = new FormData(form);
        document.getElementById('loadingOverlay').classList.add('active');
        document.getElementById('resultEmpty').style.display   = 'none';
        document.getElementById('resultContent').style.display = 'none';

        const xhr = new XMLHttpRequest();
        xhr.addEventListener('load', () => {
            document.getElementById('loadingOverlay').classList.remove('active');

            if (xhr.status === 200) {
                try {
                    const res = JSON.parse(xhr.responseText);
                    showResult(res);
                } catch {
                    showError('결과 파싱 오류');
                }
            } else {
                showError('업로드 실패: ' + xhr.status);
            }
        });

        xhr.addEventListener('error', () => {
            document.getElementById('loadingOverlay').classList.remove('active');
            showError('네트워크 오류');
        });

        xhr.open('POST', '/board/result', true);
        xhr.send(formData);
    }

    // ── 결과 표시 ──
    function showResult(res) {
        const isEmergency = res.is_emergency;   // 서버에서 boolean 반환
        const badge = document.getElementById('detectBadge');

        badge.className = 'detect-badge ' + (isEmergency ? 'emergency' : 'safe');
        badge.textContent = isEmergency ? '🚨 응급차량 감지' : '✓ 일반 차량';

        document.getElementById('resultText').textContent =
            res.analysis_result || '분석 내용이 없습니다.';

        document.getElementById('resultTime').textContent =
            new Date().toLocaleString('ko-KR');

        document.getElementById('resultEmpty').style.display   = 'none';
        document.getElementById('resultContent').style.display = 'block';
    }

    function showError(msg) {
        document.getElementById('resultEmpty').style.display = 'flex';
        document.getElementById('resultEmpty').innerHTML =
            '<span>⚠️</span><span>' + msg + '</span>';
    }

    // ── 상세 페이지 이동 ──
    function goDetail() {
        const mediaEl  = document.querySelector('#previewBox img, #previewBox video');
        const resultTxt = document.getElementById('resultText').innerText.trim();

        if (!mediaEl || !resultTxt) {
            alert('분석 완료 후 이용 가능합니다.');
            return;
        }

        try {
            localStorage.setItem('temp_analysis_data', JSON.stringify({
                type     : currentTab,
                mediaSrc : mediaEl.src,
                memo     : document.getElementById('description').value,
                result   : resultTxt,
            }));
            location.href = '/analysis';
        } catch {
            alert('파일 용량이 너무 커서 상세 페이지로 이동할 수 없습니다.');
        }
    }

    // ── 컨텍스트 메뉴 ──
    document.addEventListener('contextmenu', e => {
        const menu = document.getElementById('ctx-menu');
        if (e.target.closest('#previewBox')) {
            e.preventDefault();
            menu.style.display = 'block';
            menu.style.left    = e.clientX + 'px';
            menu.style.top     = e.clientY + 'px';
        } else {
            menu.style.display = 'none';
        }
    });

    document.addEventListener('click', () => {
        document.getElementById('ctx-menu').style.display = 'none';
    });
</script>
</body>
</html>
