{% extends 'layout/layout.html' %}
{% block content %}
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운동 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Apple SD Gothic Neo', sans-serif; }
        .stat-card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
        .flame-icon { color: #ff4500; font-size: 1.5rem; }
        .quote-section { background: #343a40; color: white; border-radius: 15px; padding: 20px; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">안녕하세요!</h2>
            <p class="text-muted">오늘은 운동하기 딱 좋은 화요일입니다.</p>
        </div>
        <div class="text-end">
            <span class="badge bg-danger p-2">연속 7일째 🔥</span>
        </div>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="card stat-card p-4 bg-primary text-white text-center">
                <h5>이번 주 총 운동량</h5>
                <h2 class="display-5 fw-bold">12h 45m</h2>
                <small>지난주보다 15% 증가 ↑</small>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card p-4 text-center">
                <h5>소모 칼로리</h5>
                <h2 class="display-5 fw-bold text-success">3,200</h2>
                <p class="text-muted">kcal</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card p-4 text-center">
                <h5>평균 심박수</h5>
                <h2 class="display-5 fw-bold text-danger">72</h2>
                <p class="text-muted">bpm</p>
            </div>
        </div>
    </div>

    <div class="card stat-card mb-5">
        <div class="card-body">
            <h5 class="card-title mb-4">주간 운동 리듬</h5>
            <div style="height: 200px; background: #e9ecef; border-radius: 10px; display: flex; align-items: flex-end; justify-content: space-around; padding: 10px;">
                <div style="height: 40%; width: 30px; background: #0d6efd; border-radius: 5px;"></div>
                <div style="height: 60%; width: 30px; background: #0d6efd; border-radius: 5px;"></div>
                <div style="height: 30%; width: 30px; background: #0d6efd; border-radius: 5px;"></div>
                <div style="height: 80%; width: 30px; background: #0d6efd; border-radius: 5px;"></div>
                <div style="height: 50%; width: 30px; background: #0d6efd; border-radius: 5px;"></div>
                <div style="height: 90%; width: 30px; background: #0d6efd; border-radius: 5px;"></div>
                <div style="height: 20%; width: 30px; background: #dee2e6; border-radius: 5px;"></div>
            </div>
            <div class="d-flex justify-content-around mt-2 text-muted small">
                <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span>
            </div>
        </div>
    </div>

    <div class="quote-section text-center">
        <h5 class="mb-3">"운동은 몸을 만드는 것이 아니라, 인생을 만드는 것이다."</h5>
        <small class="text-secondary">- 밥 아저씨의 헬스 명언집 중 -</small>
    </div>
</div>

</body>
</html>
{% endblock %}
