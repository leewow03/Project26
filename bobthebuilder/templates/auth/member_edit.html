{% extends 'layout/layout.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white text-center">
                <h4 class="mb-0">회원 정보 수정</h4>
            </div>
            <div class="card-body p-4">
                <form action="/member_edit" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted small">아이디 (변경 불가)</label>
                        <input type="text" class="form-control bg-light" value="{{ user.uid }}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">이름</label>
                        <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">새 비밀번호</label>
                        <input type="text" name="password" class="form-control" placeholder="변경 시에만 입력하세요">
                    </div>

                     <div class="mb-3">
                        <label class="form-label">신장 (cm)</label>
                        <input type="text" name="height" class="form-control" placeholder="변경 시에만 입력하세요">
                    </div>
                     <div class="mb-3">
                        <label class="form-label">체중 (kg)</label>
                        <input type="text" name="weight" class="form-control" placeholder="변경 시에만 입력하세요">
                    </div>
                     <div class="mb-3">
                        <label class="form-label">체지방 (%)</label>
                        <input type="text" name="body_fat" class="form-control" placeholder="변경 시에만 입력하세요">
                    </div>
                     <div class="mb-3">
                        <label class="form-label">근육량 (kg)</label>
                        <input type="text" name="muscle_mass" class="form-control" placeholder="변경 시에만 입력하세요">
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">수정 완료</button>
                        <a href="/myproflie" class="btn btn-outline-secondary">취소</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
